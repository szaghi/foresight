        line(self.y2ticks, self.left, p, self.left + s2 * length, p, FRAME_COLOR, 1);
      }
      if (t.major) {
        label(self.y2ticks, self.right + GAP + (y2t.out ? tickLength(y2t, true) : 0), p + 0.35 * fs,
          t, "start", 0, false, self.markup(y2t), y2t, fs);
        gridLine(self, self.left, p, self.right, p, "y2");
      }
    });
  };

  // a grid line of the panel if its kind (x, y, x2, y2, mx, my) is drawn, in the grid style
  function gridLine(panel, x1, y1, x2, y2, kind) {
    if (!panel.gridLines[kind]) return;
    var st = panel.gridStyle;
    line(panel.gridGroup, x1, y1, x2, y2, st ? st[0] : GRID_COLOR, st ? Number(st[1]) : 0.5,
      st ? (st[2] || "") : GRID_DASHES);
  }

  // tick length of an axis' settings (mirror of tick_length): the major length times its scale
  // the page coordinate of the zero of `axis` in the view [lo, hi] (unit), from `start` by `span`
  // [px], if the ticks set `tics` lie on it (gnuplot `axis`: a linear axis with 0 in view); else
  // null (mirror of on_zero)
  function zeroLine(tics, axis, lo, hi, start, span) {
    var u;
    if (!tics.axis || axis.log) return null;
    u = (axis.toUnit(0) - lo) / (hi - lo);
    return u >= 0 && u <= 1 ? start + u * span : null;
  }

  // whether a tick at value `v` is drawn: within the data range of rangelimited ticks (mirror of
  // within)
  function inRange(tics, v) {
    var tol;
    if (!tics.range) return true;
    tol = 1e-9 * Math.max(Math.abs(tics.range[1] - tics.range[0]), Math.abs(tics.range[0]),
      Math.abs(tics.range[1]), Number.MIN_VALUE);
    return v >= tics.range[0] - tol && v <= tics.range[1] + tol;
  }

  function tickLength(tics, major) {
    var scale = tics.scale || [1, 0.5];
    return TICK_MAJOR * (major ? scale[0] : scale[1]);
  }

  // second x axis ticks above the top border (mirror of the x2 part of draw_frame)
  Panel.prototype.drawX2Ticks = function () {
    var self = this, v = this.view, fs = this.fontSize, w = this.right - this.left;
    if (!this.x2ticks) return;
    clear(this.x2ticks);
    var x2t = this.x2.tics || {}, s2 = x2t.out ? -1 : 1;
    this.x2.ticks(v.u0, v.u1, w).forEach(function (t) {
      var p = self.left + (self.x2.toUnit(t.value) - v.u0) / (v.u1 - v.u0) * w;
      var length = tickLength(x2t, t.major);
      if (p < self.left - 0.5 || p > self.right + 0.5 || !inRange(x2t, t.value)) return;
      line(self.x2ticks, p, self.top, p, self.top + s2 * length, FRAME_COLOR, 1);
      if (self.x2mirror) {
        line(self.x2ticks, p, self.bottom, p, self.bottom - s2 * length, FRAME_COLOR, 1);
      }
      if (t.major) {
        label(self.x2ticks, p, self.top - (x2t.out ? tickLength(x2t, true) : 0) - GAP - 0.25 * fs,
          t, "middle", 0, false, self.markup(x2t), x2t, fs);
        gridLine(self, p, self.bottom, p, self.top, "x2");
      }
    });
  };

  // zoom by factors (fx, fy) about the page point p
  Panel.prototype.zoomAt = function (p, fx, fy) {
    var c = this.unitAt(p), v = this.view;
    this.setView({u0: c.u + (v.u0 - c.u) * fx, u1: c.u + (v.u1 - c.u) * fx,
      v0: c.v + (v.v0 - c.v) * fy, v1: c.v + (v.v1 - c.v) * fy}, false);
  };

  // zoom to the page-pixel box between points p and q
  Panel.prototype.zoomBox = function (p, q) {
    var a = this.unitAt(p), b = this.unitAt(q);
    this.setView({u0: Math.min(a.u, b.u), u1: Math.max(a.u, b.u),
      v0: Math.min(a.v, b.v), v1: Math.max(a.v, b.v)}, true);
  };

  // linked panels record the same zooms: they undo theirs together
  Panel.prototype.unzoom = function () {
    if (!this.history.length) return;
    this.setView(this.history.pop(), false, true);
    if (!linkX) return;
    this.linked.forEach(function (q) {
      if (q.history.length) q.setView(q.history.pop(), false, true);
    });
  };

  Panel.prototype.autoscale = function () {
    if (!this.isHome()) this.setView({u0: 0, u1: 1, v0: 0, v1: 1}, true);
  };

  // follow the end of the data: a zoomed x window slides to the end of the x axis, keeping its
  // width, and the y window fits the points shown (gnuplot autoscale within the window); a page
  // reloaded with new data (live monitoring) shows the latest part of it
  Panel.prototype.follow = function () {
    var v = this.view, w = v.u1 - v.u0, lo = Infinity, hi = -Infinity, u0, pad, self = this;
    if (w >= 1 - 1e-12) return;
    u0 = 1 - w;
    this.data().forEach(function (c) {
      if (c[0] < u0 || c[0] > 1 || self.hidden[c[2]]) return;
      lo = Math.min(lo, c[1]);
      hi = Math.max(hi, c[1]);
    });
    if (lo > hi) {
      lo = v.v0;
      hi = v.v1;
    } else {
      pad = hi > lo ? 0.05 * (hi - lo) : 0.05;
      lo -= pad;
      hi += pad;
    }
    this.setView({u0: u0, u1: 1, v0: lo, v1: hi}, false, true);
  };

  // plotted points in unit coordinates (y upward) with their series: [u, v, series], read once
  Panel.prototype.data = function () {
    var pair = /(-?[0-9.]+),(-?[0-9.]+)/g, coords = [];
    if (this.coords) return this.coords;
    this.plot.querySelectorAll("polyline, path").forEach(function (node) {
      var text = node.getAttribute("points") || node.getAttribute("d") || "", m;
      var series = seriesOf(node);
      while ((m = pair.exec(text)) !== null) coords.push([+m[1], 1 - m[2], series]);
    });
    this.coords = coords;
    return coords;
  };

  Panel.prototype.toggleGrid = function () {
    this.grid = !this.grid;
    this.redraw();
    this.saveState();
  };

  // zoom and grid persist in the URL hash as data values, so a reload with new data keeps the view;
  // keys are g, x, y for the first panel, g1, x1, y1 for the second, and so on
  Panel.prototype.state = function () {
    var v = this.view, n = this.suffix, items = ["g" + n + "=" + (this.grid ? 1 : 0)];
    var hidden = Object.keys(this.hidden).filter(function (k) { return this.hidden[k]; }, this);
    if (!this.isHome()) {
      items.push("x" + n + "=" + [this.x.toData(v.u0), this.x.toData(v.u1)].join(","));
      items.push("y" + n + "=" + [this.y.toData(v.v0), this.y.toData(v.v1)].join(","));
    }
    if (hidden.length) items.push("s" + n + "=" + hidden.join(","));
    return items;
  };

  // page settings first: l=0 x zoom not linked, f=1 following the end of the data
  Panel.prototype.saveState = function () {
    var page = (linkX ? [] : ["l=0"]).concat(following ? ["f=1"] : []);
    var state = page.concat.apply(page, panels.map(function (p) { return p.state(); })).join("&");
    try {
      history.replaceState(null, "", "#" + state);
    } catch (e) {
      // file:// pages may refuse history updates: a fragment-only replace is always allowed
      location.replace("#" + state);
    }
  };

  Panel.prototype.loadState = function () {
    var state = hashState(), x, y, view, n = this.suffix, self = this;
    if (state["g" + n] === "0" || state["g" + n] === "1") this.grid = state["g" + n] === "1";
    if (state["s" + n]) {
      state["s" + n].split(",").forEach(function (k) { if (Number(k) > 0) self.hidden[k] = true; });
    }
    if (state["x" + n] && state["y" + n]) {
      x = state["x" + n].split(",").map(Number);
      y = state["y" + n].split(",").map(Number);
      view = {u0: this.x.toUnit(x[0]), u1: this.x.toUnit(x[1]),
        v0: this.y.toUnit(y[0]), v1: this.y.toUnit(y[1])};
      if ([view.u0, view.u1, view.v0, view.v1].every(isFinite)) this.view = view;
    }
    this.redraw();
  };

  function hashState() {
    var state = {};
    location.hash.slice(1).split("&").forEach(function (item) {
      var pair = item.split("=");
      if (pair.length === 2) state[pair[0]] = pair[1];
    });
    return state;
  }

  // ---- page: overlays and input handling ----

  var panels = [];
  var linkX = true;      // panels with the same x axis zoom and pan their x together
  var following = false; // zoomed x windows follow the end of the data

  // panels sharing their x axis: same range and scale (a dashboard over the same iterations)
  function linkPanels() {
    panels.forEach(function (p) {
      p.linked = panels.filter(function (q) {
        return q !== p && q.group.getAttribute("data-x") === p.group.getAttribute("data-x") &&
          q.x.log === p.x.log;
      });
    });
  }

  // ---- 3D views turned by the mouse: the panel's scene (its <metadata class="fs-scene">) drawn
  // in place of the static drawing while the view differs from the script's ----

  function View3D(group) {
    var b = group.getBBox();
    this.group = group;
    this.scene = JSON.parse(group.querySelector("metadata.fs-scene").textContent);
    this.home = [this.scene.v[0], this.scene.v[1]];
    this.view = this.home.slice();
    this.layer = null;
    this.box = {left: b.x, top: b.y, right: b.x + b.width, bottom: b.y + b.height};
  }

  View3D.prototype.contains = function (p) {
    return p.x >= this.box.left && p.x <= this.box.right && p.y >= this.box.top &&
      p.y <= this.box.bottom;
  };

  // the children kept while turning: the title, the key and the color box (2D overlays)
  View3D.prototype.kept = function (c) {
    var keep = this.scene.keep || "", tag = c.tagName.toLowerCase();
    if (c === this.layer || tag === "metadata") return true;
    if (c.classList.contains("fs-key-entry") || c.classList.contains("fs-colorbox")) return true;
    return tag === "text" && keep !== "" && c.textContent !== "" &&
      keep.split("\n").indexOf(c.textContent) >= 0;
  };

  // the static drawing at the script's view, the scene's at any other
  View3D.prototype.setView = function (view) {
    var self = this, home = view[0] === this.home[0] && view[1] === this.home[1], layer;
    this.view = view;
    Array.prototype.forEach.call(this.group.children, function (c) {
      if (self.kept(c)) return;
      if (home) {
        if (c.hasAttribute("data-scene-hidden")) {
          c.removeAttribute("data-scene-hidden");
          c.removeAttribute("display");
        }
      } else if (!c.hasAttribute("data-scene-hidden") && c.getAttribute("display") !== "none") {
        c.setAttribute("data-scene-hidden", "1");
        c.setAttribute("display", "none");
      }
    });
    if (this.layer) this.layer.parentNode.removeChild(this.layer);
    this.layer = null;
    if (home) return;
    layer = element(this.group, "g", {"class": "fs-scene-view"});
    this.layer = layer;
    sceneDrawList(this.scene, view[0], view[1]).forEach(function (op) {
      var pts = op.points.map(function (q) { return fixed(q[0]) + "," + fixed(q[1]); }), a;
      if (op.kind === "l") {
        a = {points: pts.join(" "), fill: "none", stroke: op.color, "stroke-width": op.width,
          "stroke-linecap": "round"};
        if (op.dash) a["stroke-dasharray"] = op.dash;
        element(layer, "polyline", a);
      } else if (op.kind === "q") {
        a = {points: pts.join(" "), fill: op.fill, stroke: op.stroke || op.fill,
          "stroke-width": 0.5};
        element(layer, "polygon", a);
      } else if (op.kind === "p") {
        element(layer, "circle", {cx: fixed(op.points[0][0]), cy: fixed(op.points[0][1]),
          r: op.size, fill: op.color});
      } else {
        a = {x: fixed(op.points[0][0]), y: fixed(op.points[0][1]), "text-anchor": op.anchor};
        if (op.color) a.fill = op.color;
        element(layer, "text", a).textContent = op.text;
      }
    });
  };

  // a key entry toggles its series: a transparent box over the entry takes the clicks
  function keyTargets(svg) {
    // the entries of the 2D panels (a 3D view's are static)
    svg.querySelectorAll(".fs-axes:not([data-3d]) .fs-key-entry").forEach(function (node) {
      var b = node.getBBox();
      element(node, "rect", {x: b.x - 2, y: b.y - 2, width: b.width + 4, height: b.height + 4,
        fill: "transparent", cursor: "pointer"}).appendChild(document.createElementNS(NS, "title"))
        .textContent = "click: hide or show this series";
    });
  }

  function start() {
    var svg = document.querySelector("svg");
    if (!svg || !svg.querySelector(".fs-axes")) return;
    if (svg.hasAttribute("data-frame")) FRAME_COLOR = svg.getAttribute("data-frame");
    if (svg.hasAttribute("data-grid-color")) GRID_COLOR = svg.getAttribute("data-grid-color");
    var views = [], turned = null;
    svg.querySelectorAll(".fs-axes").forEach(function (group, k) {
      // a 3D view: no zoom nor pan; turned by the mouse when the page carries its scene
      if (group.hasAttribute("data-3d")) {
        if (group.querySelector("metadata.fs-scene")) views.push(new View3D(group));
        return;
      }
      panels.push(new Panel(svg, group, k));
    });
    if (!panels.length && !views.length) return;
    if (panels.length) {
      linkPanels();
      keyTargets(svg);
    }
    var panel = panels[0] || null;
    var width = Number(svg.getAttribute("width"));
    var height = Number(svg.getAttribute("height"));
    var refresh = Number(svg.getAttribute("data-refresh") || 0);
    // overlays in the theme colors on a themed page: its frame color, its page color (first rect)
    var ink = svg.hasAttribute("data-frame") ? FRAME_COLOR : "#555";
    var readout = element(svg, "text", {x: 4, y: height - 4, "font-size": 10, fill: ink});
    var box = element(svg, "rect", {fill: "none", stroke: ink, "stroke-dasharray": "3,3",
      display: "none"});
    var help = helpOverlay(svg);
    var drag = null;

    function point(evt) {
      var p = svg.createSVGPoint();
      p.x = evt.clientX;
      p.y = evt.clientY;
      return p.matrixTransform(svg.getScreenCTM().inverse());
    }

    // panel under the page point p, or null
    function panelAt(p) {
      // topmost first: a panel drawn later (an inset) lies over the earlier ones
      for (var k = panels.length - 1; k >= 0; k--) if (panels[k].contains(p)) return panels[k];
      return null;
    }

    // 3D view under the page point p, or null
    function viewAt(p) {
      for (var k = views.length - 1; k >= 0; k--) if (views[k].contains(p)) return views[k];
      return null;
    }

    function showReadout(p) {
      var c, hit = panelAt(p);
      if (drag && drag.turn) return;
      if (!hit) { readout.textContent = ""; return; }
      panel = hit;
      c = panel.unitAt(p);
      readout.textContent = "x = " + panel.x.show(panel.x.toData(c.u)) +
        "   y = " + panel.y.show(panel.y.toData(c.v)) +
        (panel.y2 ? "   y2 = " + panel.y2.show(panel.y2.toData(c.v)) : "") +
        (panel.x2 ? "   x2 = " + panel.x2.show(panel.x2.toData(c.u)) : "");
    }

    svg.addEventListener("contextmenu", function (evt) { evt.preventDefault(); });
    svg.addEventListener("wheel", function (evt) {
      var p = point(evt), f;
      if (!panelAt(p)) return;
      panel = panelAt(p);
      evt.preventDefault();
      f = evt.deltaY < 0 ? 1 / ZOOM_FACTOR : ZOOM_FACTOR;
      panel.zoomAt(p, evt.ctrlKey ? 1 : f, evt.shiftKey ? 1 : f);
    }, {passive: false});
    svg.addEventListener("mousedown", function (evt) {
      var p = point(evt), entry = evt.target.closest(".fs-key-entry"), v3 = viewAt(p);
      if (v3 && evt.button === 0 && !entry) {
        // gnuplot's left drag on a 3D view: turn it
        evt.preventDefault();
        turned = v3;
        drag = {button: 0, turn: v3, start: p, from: v3.view.slice()};
        return;
      }
      if (entry && evt.button === 0 && panels.length) {
        evt.preventDefault();
        panels.filter(function (q) { return q.group.contains(entry); })[0]
          .toggleSeries(seriesOf(entry));
        return;
      }
      if (!panelAt(p)) return;
      panel = panelAt(p);
      evt.preventDefault();
      drag = {button: evt.button, start: p, view: panel.view};
    });
    window.addEventListener("mousemove", function (evt) {
      var p = point(evt), v, du, dv;
      showReadout(p);
      if (!drag) return;
      if (drag.turn) {
        v = dragView(drag.from, p.x - drag.start.x, p.y - drag.start.y, width, height);
        if (v[0] !== drag.turn.view[0] || v[1] !== drag.turn.view[1]) drag.turn.setView(v);
        readout.textContent = "view: " + v[0] + ", " + v[1] + "   (u: the script's view)";
        return;
      }
      if (drag.button === 0) {
        v = drag.view;
        du = (p.x - drag.start.x) / (panel.right - panel.left) * (v.u1 - v.u0);
        dv = (p.y - drag.start.y) / (panel.bottom - panel.top) * (v.v1 - v.v0);
        panel.setView({u0: v.u0 - du, u1: v.u1 - du, v0: v.v0 + dv, v1: v.v1 + dv}, false);
      } else if (drag.button === 2) {
        box.setAttribute("x", Math.min(p.x, drag.start.x));
        box.setAttribute("y", Math.min(p.y, drag.start.y));
        box.setAttribute("width", Math.abs(p.x - drag.start.x));
        box.setAttribute("height", Math.abs(p.y - drag.start.y));
        box.setAttribute("display", "inline");
      }
    });
    window.addEventListener("mouseup", function (evt) {
      var p = point(evt);
      if (drag && drag.button === 2) {
        box.setAttribute("display", "none");
        if (Math.abs(p.x - drag.start.x) >= MIN_BOX && Math.abs(p.y - drag.start.y) >= MIN_BOX) {
          panel.zoomBox(drag.start, p);
        }
      }
      drag = null;
    });
    document.addEventListener("keydown", function (evt) {
      if (evt.ctrlKey || evt.metaKey || evt.altKey) return;
      if (evt.key === "u" && turned) {
        turned.setView(turned.home.slice());
        readout.textContent = "";
        turned = null;
        return;
      }
      if (!panel) {
        if (evt.key === "h" || evt.key === "?") {
          help.setAttribute("display", help.getAttribute("display") === "none" ? "inline" : "none");
        }
        return;
      }
      if (evt.key === "u") panel.unzoom();
      else if (evt.key === "a") panel.autoscale();
      else if (evt.key === "g") panel.toggleGrid();
      else if (evt.key === "l") {
        linkX = !linkX;
        readout.textContent = "x zoom " + (linkX ? "linked" : "per panel");
        panel.saveState();
      } else if (evt.key === "f") {
        following = !following;
        readout.textContent = following ? "following the end of the data" : "follow off";
        if (following) panels.forEach(function (q) { q.follow(); });
        panel.saveState();
      }
      else if (evt.key === "h" || evt.key === "?") {
        help.setAttribute("display", help.getAttribute("display") === "none" ? "inline" : "none");
      }
    });

    linkX = hashState().l !== "0";
    following = hashState().f === "1";
    panels.forEach(function (p) { p.loadState(); });
    if (following) panels.forEach(function (p) { p.follow(); });
    if (refresh > 0) {
      (function reload() {
        setTimeout(function () { if (drag) reload(); else location.reload(); }, refresh * 1000);
      })();
    }
  }

  function helpOverlay(svg) {
    var lines = ["wheel: zoom (shift: x only, ctrl: y only)", "left drag: pan (3D view: turn it)",
      "right drag: zoom box", "u: undo zoom (3D view: the script's view)", "a: autoscale",
      "g: toggle grid",
      "click a key entry: hide or show its series", "l: link or unlink the x zoom of the panels",
      "f: follow the end of the data (zoom first)", "h: toggle this help"];
    var group = element(svg, "g", {display: "none"});
    var page = Array.prototype.filter.call(svg.children, function (c) {
      return c.tagName.toLowerCase() === "rect";
    })[0];
    var themed = svg.hasAttribute("data-frame");
    element(group, "rect", {x: 20, y: 20, width: 310, height: 16 * lines.length + 12,
      fill: themed && page ? page.getAttribute("fill") : "white",
      stroke: themed ? FRAME_COLOR : "#555", opacity: 0.95});
    lines.forEach(function (text, i) {
      element(group, "text", {x: 30, y: 38 + 16 * i, "font-size": 12}).textContent = text;
    });
    return group;
  }

  start();
})();
</script>
</body>
</html>
