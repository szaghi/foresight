  // error bars of the plot area: segments in viewBox coordinates (unit square, y downward)
  function readBars(group) {
    var bars = [], pattern = /M([^,]+),([^L]+)L([^,]+),([^M]+)/g;
    group.querySelectorAll(".fs-ybars, .fs-xbars").forEach(function (path) {
      var d = path.getAttribute("d").replace(/\s+/g, ""), m;
      var style = {vertical: path.getAttribute("class") === "fs-ybars", series: seriesOf(path),
        cap: Number(path.getAttribute("data-cap")), color: path.getAttribute("stroke"),
        width: path.getAttribute("stroke-width")};
      while ((m = pattern.exec(d)) !== null) {
        bars.push({style: style, ends: [[+m[1], +m[2]], [+m[3], +m[4]]]});
      }
    });
    return bars;
  }

  // point type markers: centres in viewBox coordinates (unit square, y downward) and the marker
  function readPoints(group) {
    var points = [];
    group.querySelectorAll(".fs-pts").forEach(function (path) {
      var centres = path.getAttribute("d").replace(/\s+/g, "").split("M").filter(Boolean)
        .map(function (pair) { return pair.split(",").map(Number); });
      points.push({pt: Number(path.getAttribute("data-pt")), series: seriesOf(path),
        size: Number(path.getAttribute("data-size")), lw: path.getAttribute("data-lw"),
        color: path.getAttribute("data-color"), centres: centres});
    });
    return points;
  }

  function px(v) { return v.toFixed(2); }

  // path of a marker of half width r centred on (x, y), gnuplot svg shapes (mirror of marker_path)
  function markerPath(x, y, r, shape) {
    var poly = function (xs, ys) {
      return xs.map(function (a, k) {
        return (k ? "L" : "M") + px(x + r * a) + "," + px(y + r * ys[k]);
      }).join("") + "Z";
    };
    var circle = function (c) {
      var arc = "A" + px(c) + "," + px(c) + " 0 1 0 ";
      return "M" + px(x - c) + "," + px(y) + arc + px(x + c) + "," + px(y) + arc + px(x - c) + "," +
        px(y) + "Z";
    };
    var plus = "M" + px(x - r) + "," + px(y) + "H" + px(x + r) + "M" + px(x) + "," + px(y - r) +
      "V" + px(y + r);
    var cross = "M" + px(x - r) + "," + px(y - r) + "L" + px(x + r) + "," + px(y + r) + "M" +
      px(x + r) + "," + px(y - r) + "L" + px(x - r) + "," + px(y + r);
    if (shape === 0) return circle(0.5);
    if (shape === 1) return plus;
    if (shape === 2) return cross;
    if (shape === 3) return plus + cross;
    if (shape <= 5) return poly([-1, 1, 1, -1], [-1, -1, 1, 1]);
    if (shape <= 7) return circle(r);
    if (shape <= 9) return poly([0, -1.33, 1.33], [-1.33, 0.67, 0.67]);
    if (shape <= 11) return poly([0, -1.33, 1.33], [1.33, -0.67, -0.67]);
    if (shape <= 13) return poly([0, 1.414, 0, -1.414], [-1.414, 0, 1.414, 0]);
    return poly([0, 1.265, 0.782, -0.782, -1.265], [1.33, 0.411, -1.067, -1.067, 0.411]);
  }

  Panel.prototype.isHome = function () {
    var v = this.view;
    return v.u0 === 0 && v.u1 === 1 && v.v0 === 0 && v.v1 === 1;
  };

  Panel.prototype.contains = function (p) {
    return p.x >= this.left && p.x <= this.right && p.y >= this.top && p.y <= this.bottom;
  };

  // page pixel -> current view unit coordinates
  Panel.prototype.unitAt = function (p) {
    var v = this.view;
    return {u: v.u0 + (p.x - this.left) / (this.right - this.left) * (v.u1 - v.u0),
      v: v.v0 + (this.bottom - p.y) / (this.bottom - this.top) * (v.v1 - v.v0)};
  };

  // a view change spreads its x window to the linked panels, unless it comes from one (alone)
  Panel.prototype.setView = function (view, record, alone) {
    if (!(view.u1 - view.u0 > 1e-12 && view.v1 - view.v0 > 1e-12)) return;
    if (record) this.history.push(this.view);
    this.view = view;
    this.redraw();
    this.saveState();
    if (alone || !linkX) return;
    this.linked.forEach(function (q) {
      q.setView({u0: view.u0, u1: view.u1, v0: q.view.v0, v1: q.view.v1}, record, true);
    });
  };

  Panel.prototype.redraw = function () {
    var v = this.view;
    this.plot.setAttribute("viewBox", [v.u0, 1 - v.v1, v.u1 - v.u0, v.v1 - v.v0].join(" "));
    this.gridGroup.setAttribute("display", this.grid ? "inline" : "none");
    if (this.isHome()) {
      this.gridGroup.innerHTML = this.original[0];
      this.xticks.innerHTML = this.original[1];
      this.yticks.innerHTML = this.original[2];
      if (this.caps) this.caps.innerHTML = this.original[3];
      if (this.y2ticks) this.y2ticks.innerHTML = this.original[4];
      if (this.marks) this.marks.innerHTML = this.original[5];
    } else {
      this.drawTicks();
      this.drawCaps();
      this.drawMarks();
    }
    this.showSeries();
  };

  // hidden series: their plot elements and overlays not displayed, their key entries dimmed
  Panel.prototype.showSeries = function () {
    var self = this;
    this.group.querySelectorAll(".fs-series, .fs-marks [data-series], .fs-caps [data-series]")
      .forEach(function (node) {
        node.setAttribute("display", self.hidden[seriesOf(node)] ? "none" : "inline");
      });
    this.group.querySelectorAll(".fs-key-entry").forEach(function (node) {
      node.setAttribute("opacity", self.hidden[seriesOf(node)] ? 0.3 : 1);
    });
  };

  Panel.prototype.toggleSeries = function (series) {
    this.hidden[series] = !this.hidden[series];
    this.redraw();
    this.saveState();
  };

  // point type markers keep their pixel shape: recomputed in the pixel overlay for the current view
  Panel.prototype.drawMarks = function () {
    var self = this, v = this.view;
    var w = this.right - this.left, h = this.bottom - this.top;
    if (!this.marks) return;
    clear(this.marks);
    this.points.forEach(function (p) {
      var r = p.size / 2, shape = p.pt > 0 ? modulo(p.pt - 1, 15) + 1 : 0, d = [];
      if (self.hidden[p.series]) return;
      var filled = shape === 0 || (shape >= 5 && shape % 2 === 1);
      p.centres.forEach(function (c) {
        var x = (c[0] - v.u0) / (v.u1 - v.u0) * w, y = (c[1] - (1 - v.v1)) / (v.v1 - v.v0) * h;
        if (x >= -r && x <= w + r && y >= -r && y <= h + r) d.push(markerPath(x, y, r, shape));
      });
      element(self.marks, "path", {"data-series": p.series, fill: filled ? p.color : "none",
        stroke: p.color, "stroke-width": p.lw, d: d.join("")});
    });
  };

  // error bar caps keep their pixel length: recomputed in the pixel overlay for the current view
  Panel.prototype.drawCaps = function () {
    var self = this, v = this.view;
    var w = this.right - this.left, h = this.bottom - this.top;
    if (!this.caps) return;
    clear(this.caps);
    this.bars.forEach(function (bar) {
      var half = bar.style.cap / 2;
      if (self.hidden[bar.style.series]) return;
      bar.ends.forEach(function (end) {
        var x = (end[0] - v.u0) / (v.u1 - v.u0) * w;
        var y = (end[1] - (1 - v.v1)) / (v.v1 - v.v0) * h;
        if (bar.style.vertical) {
          line(self.caps, x - half, y, x + half, y, bar.style.color, bar.style.width);
        } else {
          line(self.caps, x, y - half, x, y + half, bar.style.color, bar.style.width);
        }
      });
    });
  };

  // regenerate ticks, tick labels and grid for the current view (mirror of draw_frame/draw_grid)
  Panel.prototype.drawTicks = function () {
    var self = this, v = this.view, fs = this.fontSize;
    var w = this.right - this.left, h = this.bottom - this.top;
    clear(this.gridGroup);
    clear(this.xticks);
    clear(this.yticks);
    this.x.ticks(v.u0, v.u1, w).forEach(function (t) {
      var p = self.left + (self.x.toUnit(t.value) - v.u0) / (v.u1 - v.u0) * w;
      var length = t.major ? TICK_MAJOR : TICK_MINOR;
      if (p < self.left - 0.5 || p > self.right + 0.5) return;
      line(self.xticks, p, self.bottom, p, self.bottom - length, FRAME_COLOR, 1);
      if (self.mirror[0]) line(self.xticks, p, self.top, p, self.top + length, FRAME_COLOR, 1);
      if (!t.major) return;
      label(self.xticks, p, self.bottom + GAP + fs, t, "middle");
      line(self.gridGroup, p, self.bottom, p, self.top, GRID_COLOR, 0.5, GRID_DASHES);
    });
    this.y.ticks(v.v0, v.v1, h).forEach(function (t) {
      var p = self.bottom - (self.y.toUnit(t.value) - v.v0) / (v.v1 - v.v0) * h;
      var length = t.major ? TICK_MAJOR : TICK_MINOR;
      if (p < self.top - 0.5 || p > self.bottom + 0.5) return;
      line(self.yticks, self.left, p, self.left + length, p, FRAME_COLOR, 1);
      if (self.mirror[1]) line(self.yticks, self.right, p, self.right - length, p, FRAME_COLOR, 1);
      if (!t.major) return;
      label(self.yticks, self.left - GAP, p + 0.35 * fs, t, "end");
      line(self.gridGroup, self.left, p, self.right, p, GRID_COLOR, 0.5, GRID_DASHES);
    });
    if (!this.y2ticks) return;
    clear(this.y2ticks);
    this.y2.ticks(v.v0, v.v1, h).forEach(function (t) {
      var p = self.bottom - (self.y2.toUnit(t.value) - v.v0) / (v.v1 - v.v0) * h;
      var length = t.major ? TICK_MAJOR : TICK_MINOR;
      if (p < self.top - 0.5 || p > self.bottom + 0.5) return;
      line(self.y2ticks, self.right, p, self.right - length, p, FRAME_COLOR, 1);
      if (self.mirror[2]) line(self.y2ticks, self.left, p, self.left + length, p, FRAME_COLOR, 1);
      if (t.major) label(self.y2ticks, self.right + GAP, p + 0.35 * fs, t, "start");
    });
  };

  // zoom by factors (fx, fy) about the page point p
  Panel.prototype.zoomAt = function (p, fx, fy) {
    var c = this.unitAt(p), v = this.view;
    this.setView({u0: c.u + (v.u0 - c.u) * fx, u1: c.u + (v.u1 - c.u) * fx,
      v0: c.v + (v.v0 - c.v) * fy, v1: c.v + (v.v1 - c.v) * fy}, false);
  };

  // zoom to the page-pixel box between points p and q
  Panel.prototype.zoomBox = function (p, q) {
    var a = this.unitAt(p), b = this.unitAt(q);
    this.setView({u0: Math.min(a.u, b.u), u1: Math.max(a.u, b.u),
      v0: Math.min(a.v, b.v), v1: Math.max(a.v, b.v)}, true);
  };

  // linked panels record the same zooms: they undo theirs together
  Panel.prototype.unzoom = function () {
    if (!this.history.length) return;
    this.setView(this.history.pop(), false, true);
    if (!linkX) return;
    this.linked.forEach(function (q) {
      if (q.history.length) q.setView(q.history.pop(), false, true);
    });
  };

  Panel.prototype.autoscale = function () {
    if (!this.isHome()) this.setView({u0: 0, u1: 1, v0: 0, v1: 1}, true);
  };

  // follow the end of the data: a zoomed x window slides to the end of the x axis, keeping its
  // width, and the y window fits the points shown (gnuplot autoscale within the window); a page
  // reloaded with new data (live monitoring) shows the latest part of it
  Panel.prototype.follow = function () {
    var v = this.view, w = v.u1 - v.u0, lo = Infinity, hi = -Infinity, u0, pad, self = this;
    if (w >= 1 - 1e-12) return;
    u0 = 1 - w;
    this.data().forEach(function (c) {
      if (c[0] < u0 || c[0] > 1 || self.hidden[c[2]]) return;
      lo = Math.min(lo, c[1]);
      hi = Math.max(hi, c[1]);
    });
    if (lo > hi) {
      lo = v.v0;
      hi = v.v1;
    } else {
      pad = hi > lo ? 0.05 * (hi - lo) : 0.05;
      lo -= pad;
      hi += pad;
    }
    this.setView({u0: u0, u1: 1, v0: lo, v1: hi}, false, true);
  };

  // plotted points in unit coordinates (y upward) with their series: [u, v, series], read once
  Panel.prototype.data = function () {
    var pair = /(-?[0-9.]+),(-?[0-9.]+)/g, coords = [];
    if (this.coords) return this.coords;
    this.plot.querySelectorAll("polyline, path").forEach(function (node) {
      var text = node.getAttribute("points") || node.getAttribute("d") || "", m;
      var series = seriesOf(node);
      while ((m = pair.exec(text)) !== null) coords.push([+m[1], 1 - m[2], series]);
    });
    this.coords = coords;
    return coords;
  };

  Panel.prototype.toggleGrid = function () {
    this.grid = !this.grid;
    this.redraw();
    this.saveState();
  };

  // zoom and grid persist in the URL hash as data values, so a reload with new data keeps the view;
  // keys are g, x, y for the first panel, g1, x1, y1 for the second, and so on
  Panel.prototype.state = function () {
    var v = this.view, n = this.suffix, items = ["g" + n + "=" + (this.grid ? 1 : 0)];
    var hidden = Object.keys(this.hidden).filter(function (k) { return this.hidden[k]; }, this);
    if (!this.isHome()) {
      items.push("x" + n + "=" + [this.x.toData(v.u0), this.x.toData(v.u1)].join(","));
      items.push("y" + n + "=" + [this.y.toData(v.v0), this.y.toData(v.v1)].join(","));
    }
    if (hidden.length) items.push("s" + n + "=" + hidden.join(","));
    return items;
  };

  // page settings first: l=0 x zoom not linked, f=1 following the end of the data
  Panel.prototype.saveState = function () {
    var page = (linkX ? [] : ["l=0"]).concat(following ? ["f=1"] : []);
    var state = page.concat.apply(page, panels.map(function (p) { return p.state(); })).join("&");
    try {
      history.replaceState(null, "", "#" + state);
    } catch (e) {
      // file:// pages may refuse history updates: a fragment-only replace is always allowed
      location.replace("#" + state);
    }
  };

  Panel.prototype.loadState = function () {
    var state = hashState(), x, y, view, n = this.suffix, self = this;
    if (state["g" + n] === "0" || state["g" + n] === "1") this.grid = state["g" + n] === "1";
    if (state["s" + n]) {
      state["s" + n].split(",").forEach(function (k) { if (Number(k) > 0) self.hidden[k] = true; });
    }
    if (state["x" + n] && state["y" + n]) {
      x = state["x" + n].split(",").map(Number);
      y = state["y" + n].split(",").map(Number);
      view = {u0: this.x.toUnit(x[0]), u1: this.x.toUnit(x[1]),
        v0: this.y.toUnit(y[0]), v1: this.y.toUnit(y[1])};
      if ([view.u0, view.u1, view.v0, view.v1].every(isFinite)) this.view = view;
    }
    this.redraw();
  };

  function hashState() {
    var state = {};
    location.hash.slice(1).split("&").forEach(function (item) {
      var pair = item.split("=");
      if (pair.length === 2) state[pair[0]] = pair[1];
    });
    return state;
  }

  // ---- page: overlays and input handling ----

  var panels = [];
  var linkX = true;      // panels with the same x axis zoom and pan their x together
  var following = false; // zoomed x windows follow the end of the data

  // panels sharing their x axis: same range and scale (a dashboard over the same iterations)
  function linkPanels() {
    panels.forEach(function (p) {
      p.linked = panels.filter(function (q) {
        return q !== p && q.group.getAttribute("data-x") === p.group.getAttribute("data-x") &&
          q.x.log === p.x.log;
      });
    });
  }

  // a key entry toggles its series: a transparent box over the entry takes the clicks
  function keyTargets(svg) {
    svg.querySelectorAll(".fs-key-entry").forEach(function (node) {
      var b = node.getBBox();
      element(node, "rect", {x: b.x - 2, y: b.y - 2, width: b.width + 4, height: b.height + 4,
        fill: "transparent", cursor: "pointer"}).appendChild(document.createElementNS(NS, "title"))
        .textContent = "click: hide or show this series";
    });
  }

  function start() {
    var svg = document.querySelector("svg");
    if (!svg || !svg.querySelector(".fs-axes")) return;
    svg.querySelectorAll(".fs-axes").forEach(function (group, k) {
      panels.push(new Panel(svg, group, k));
    });
    linkPanels();
    keyTargets(svg);
    var panel = panels[0];
    var height = Number(svg.getAttribute("height"));
    var refresh = Number(svg.getAttribute("data-refresh") || 0);
    var readout = element(svg, "text", {x: 4, y: height - 4, "font-size": 10, fill: "#555"});
    var box = element(svg, "rect", {fill: "none", stroke: "#555", "stroke-dasharray": "3,3",
      display: "none"});
    var help = helpOverlay(svg);
    var drag = null;

    function point(evt) {
      var p = svg.createSVGPoint();
      p.x = evt.clientX;
      p.y = evt.clientY;
      return p.matrixTransform(svg.getScreenCTM().inverse());
    }

    // panel under the page point p, or null
    function panelAt(p) {
      // topmost first: a panel drawn later (an inset) lies over the earlier ones
      for (var k = panels.length - 1; k >= 0; k--) if (panels[k].contains(p)) return panels[k];
      return null;
    }

    function showReadout(p) {
      var c, hit = panelAt(p);
      if (!hit) { readout.textContent = ""; return; }
      panel = hit;
      c = panel.unitAt(p);
      readout.textContent = "x = " + shortNumber(panel.x.toData(c.u)) +
        "   y = " + shortNumber(panel.y.toData(c.v)) +
        (panel.y2 ? "   y2 = " + shortNumber(panel.y2.toData(c.v)) : "");
    }

    svg.addEventListener("contextmenu", function (evt) { evt.preventDefault(); });
    svg.addEventListener("wheel", function (evt) {
      var p = point(evt), f;
      if (!panelAt(p)) return;
      panel = panelAt(p);
      evt.preventDefault();
      f = evt.deltaY < 0 ? 1 / ZOOM_FACTOR : ZOOM_FACTOR;
      panel.zoomAt(p, evt.ctrlKey ? 1 : f, evt.shiftKey ? 1 : f);
    }, {passive: false});
    svg.addEventListener("mousedown", function (evt) {
      var p = point(evt), entry = evt.target.closest(".fs-key-entry");
      if (entry && evt.button === 0) {
        evt.preventDefault();
        panels.filter(function (q) { return q.group.contains(entry); })[0]
          .toggleSeries(seriesOf(entry));
        return;
      }
      if (!panelAt(p)) return;
      panel = panelAt(p);
      evt.preventDefault();
      drag = {button: evt.button, start: p, view: panel.view};
    });
    window.addEventListener("mousemove", function (evt) {
      var p = point(evt), v, du, dv;
      showReadout(p);
      if (!drag) return;
      if (drag.button === 0) {
        v = drag.view;
        du = (p.x - drag.start.x) / (panel.right - panel.left) * (v.u1 - v.u0);
        dv = (p.y - drag.start.y) / (panel.bottom - panel.top) * (v.v1 - v.v0);
        panel.setView({u0: v.u0 - du, u1: v.u1 - du, v0: v.v0 + dv, v1: v.v1 + dv}, false);
      } else if (drag.button === 2) {
        box.setAttribute("x", Math.min(p.x, drag.start.x));
        box.setAttribute("y", Math.min(p.y, drag.start.y));
        box.setAttribute("width", Math.abs(p.x - drag.start.x));
        box.setAttribute("height", Math.abs(p.y - drag.start.y));
        box.setAttribute("display", "inline");
      }
    });
    window.addEventListener("mouseup", function (evt) {
      var p = point(evt);
      if (drag && drag.button === 2) {
        box.setAttribute("display", "none");
        if (Math.abs(p.x - drag.start.x) >= MIN_BOX && Math.abs(p.y - drag.start.y) >= MIN_BOX) {
          panel.zoomBox(drag.start, p);
        }
      }
      drag = null;
    });
    document.addEventListener("keydown", function (evt) {
      if (evt.ctrlKey || evt.metaKey || evt.altKey) return;
      if (evt.key === "u") panel.unzoom();
      else if (evt.key === "a") panel.autoscale();
      else if (evt.key === "g") panel.toggleGrid();
      else if (evt.key === "l") {
        linkX = !linkX;
        readout.textContent = "x zoom " + (linkX ? "linked" : "per panel");
        panel.saveState();
      } else if (evt.key === "f") {
        following = !following;
        readout.textContent = following ? "following the end of the data" : "follow off";
        if (following) panels.forEach(function (q) { q.follow(); });
        panel.saveState();
      }
      else if (evt.key === "h" || evt.key === "?") {
        help.setAttribute("display", help.getAttribute("display") === "none" ? "inline" : "none");
      }
    });

    linkX = hashState().l !== "0";
    following = hashState().f === "1";
    panels.forEach(function (p) { p.loadState(); });
    if (following) panels.forEach(function (p) { p.follow(); });
    if (refresh > 0) {
      (function reload() {
        setTimeout(function () { if (drag) reload(); else location.reload(); }, refresh * 1000);
      })();
    }
  }

  function helpOverlay(svg) {
    var lines = ["wheel: zoom (shift: x only, ctrl: y only)", "left drag: pan",
      "right drag: zoom box", "u: undo zoom", "a: autoscale", "g: toggle grid",
      "click a key entry: hide or show its series", "l: link or unlink the x zoom of the panels",
      "f: follow the end of the data (zoom first)", "h: toggle this help"];
    var group = element(svg, "g", {display: "none"});
    element(group, "rect", {x: 20, y: 20, width: 310, height: 16 * lines.length + 12,
      fill: "white", stroke: "#555", opacity: 0.95});
    lines.forEach(function (text, i) {
      element(group, "text", {x: 30, y: 38 + 16 * i, "font-size": 12}).textContent = text;
    });
    return group;
  }

  start();
})();
</script>
</body>
</html>
